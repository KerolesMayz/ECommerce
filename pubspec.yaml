name: ecommerce_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.3.4

dependencies:
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  carousel_slider_plus: ^7.1.1
  flutter:
    sdk: flutter
  flutter_screenutil:
  flutter_slidable: ^4.0.1
  auto_size_text:
  colornames: ^0.2.0
  flutter_svg: ^2.2.0
  flutter_native_splash: ^2.4.6
  flutter_bloc: ^9.1.1
  dio: ^5.9.0
  connectivity_plus: ^6.1.5
  readmore:
  smooth_page_indicator: ^1.2.1
  injectable: ^2.5.1
  get_it: ^8.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints:
  injectable_generator: 2.6.2
  build_runner: any

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg_images/



  fonts:
     - family: Poppins
       fonts:
         - asset: assets/fonts/Poppins-.ttf



